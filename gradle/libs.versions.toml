[versions]
morphe-patcher = "2.0.1"
#noinspection GradleDependency
smali = "4220ae75f7"
gson = "2.15.0"
junit = "4.13.2"
org-json = "20260814"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit = { module = "junit:junit", version.ref = "junit" }
# The real org.json for JVM tests; the app uses the platform's copy.
org-json = { module = "org.json:json", version.ref = "org-json" }
# Gradle plugins adds the dependency during build, this declaration is here only for dependabot to provide updates.
#noinspection UnusedVersionCatalogEntry
morphe-patcher = { module = "app.morphe:morphe-patcher", version.ref = "morphe-patcher" }
